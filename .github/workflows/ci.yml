name: ci
on:
  push:
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testes de unidade
        run: node --test tests/*.test.mjs
      - name: Gate de contraste (D9)
        run: node scripts/valida_contraste.mjs
      - name: Gate de dados publicos (denylist D5)
        run: node scripts/valida_snapshot.mjs
