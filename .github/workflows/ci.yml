# movimenta7 — quality gate first; private ingestion and Pages publication second.
#
# `qa` is deliberately secretless. The only job allowed to read the private feed
# is `publish`, which is restricted in code to main and protected by the
# `github-pages` environment. A dispatch against another branch may run the
# public checks, but it cannot read production secrets or publish that branch.
name: ci e publicacao

on:
  push:
    branches: [main]
  pull_request:
  # Used by the Apps Script after a form submission or a `remover` edit.
  workflow_dispatch:
  # Used only by refresh.yml, the isolated scheduled fallback.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Testes de unidade
        run: node --test tests/*.test.mjs

      - name: Gate de contraste (D9)
        run: node scripts/valida_contraste.mjs

      - name: Gate anti-innerHTML nos popups (CVE-2025-69993)
        run: node scripts/valida_popup.mjs

      # Exercise the public-data gates without contacting the private origin.
      # publish repeats both gates after ingesting the current private feed.
      - name: Reconstruir snapshot de teste sem segredos
        run: node scripts/publicar_snapshot.mjs

      - name: Gate de dados publicos (allowlist D5/ADR-0004)
        run: node scripts/valida_snapshot.mjs

  publish:
    needs: qa
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Restaurar cache de links curtos do Google Maps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/geocache.json
          key: ${{ runner.os }}-mov7-geocode-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-mov7-geocode-

      - name: Trazer os cadastros do feed privado
        env:
          PLANILHA_FEED_URL: ${{ secrets.PLANILHA_FEED_URL }}
          PLANILHA_FEED_TOKEN: ${{ secrets.PLANILHA_FEED_TOKEN }}
        run: node scripts/ingerir_csv.mjs

      - name: Salvar cache de links curtos atualizado
        if: hashFiles('.cache/geocache.json.changed') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/geocache.json
          key: ${{ runner.os }}-mov7-geocode-${{ github.run_id }}

      - name: Reconstruir o snapshot a partir da moderacao
        run: node scripts/publicar_snapshot.mjs

      - name: Gate final de dados publicos (allowlist D5/ADR-0004)
        run: node scripts/valida_snapshot.mjs

      # Publish only the files loaded by the page. Private sources, scripts,
      # tests, docs and the moderation projection are excluded by construction.
      - name: Montar o site (so o que a pagina carrega)
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r css js data assets vendor _site/
          echo "--- publicado:" && find _site -type f | sort

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
          retention-days: 1

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
